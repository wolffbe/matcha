# docker-compose.yml

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hashing
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  index:
    build:
      context: ./index
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - REQUEST_QUEUE=index_requests
      - RESULT_QUEUE_PREFIX=results_
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  hashing:
    build:
      context: ./hashing
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - REQUEST_QUEUE=index_requests
      - RESULT_QUEUE_PREFIX=results_
      - REQUEST_TIMEOUT=120
    depends_on:
      redis:
        condition: service_healthy
      index:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data: